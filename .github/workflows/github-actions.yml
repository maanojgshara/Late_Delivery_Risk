name: AIAP Assessment 24
# on: [push, workflow_dispatch]
on: [push, workflow_dispatch]

jobs:
  run-end-to-end-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run executable bash script
        run: bash ./run.sh
        
        # --- OPTIONAL inference pipeline run ---
      - name: Run executable bash script
        run: bash ./predict.sh
        
        # --- ADDED ARTIFACT UPLOAD STEP ---
      - name: Upload Pipeline Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pipeline_output
          path: |
                 models/
                 artifacts/      
        # ----------------------------------

      - name: Assessment 24 Reminder
        run: |
          echo "Reminder to add AISG-AIAP as a collaborator in your repository"
          echo "Once your submission is complete, fill up the form provided in the Assessment 24 document"
